# Cloudflare Pages build configuration
# Deploy frontend from the /frontend directory

[build]
command = "npm run build"
directory = "frontend"
output = "dist"

[build.environment]
NODE_VERSION = "20"

# SPA routing — send all paths to index.html
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

# Security headers for the static frontend
[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
X-XSS-Protection = "1; mode=block"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(self), geolocation=(), payment=(), usb=()"
Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.razorpay.com wss://*.render.com https://*.render.com https://*.neon.tech; frame-src https://api.razorpay.com"

# Cache static assets aggressively
[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# Don't cache HTML (SPA shell should always be fresh)
[[headers]]
for = "/index.html"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

# Service worker should not be cached
[[headers]]
for = "/sw.js"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"
